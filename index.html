<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffc629">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speak Up">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Speak Up 英语口语</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: a cheerful cartoon buddy who claps for every try
   IDEA: a sticker book — thick ink outlines, chunky drop shadows, bright stickers for every scene
   PICTURE: Pip the headphone chick mascot + a cartoon icon for each life scene; the practice card is the stage
   COLOUR+TYPE: school-bus yellow, sky, mint, coral, grape on a dotted sky ground; Baloo 2 + Nunito heavy
   LAYOUT: one column ≤760px, sticky sticker tabs, cards stack on phones */
:root{color-scheme:light dark;
--bg:light-dark(#eef8ff,#0f1a2e);--dots:light-dark(#d3ecff,#1a2945);--ink:light-dark(#1b2440,#f0f4ff);--muted:light-dark(#56607a,#a9b4cf);
--line:light-dark(#1b2440,#04070f);--card:light-dark(#ffffff,#1b2742);--soft:light-dark(#fff3c4,#3a3217);
--bus:#ffcf33;--coral:#ff6b5b;--mint:#3ccf91;--sky:#4cb8ff;--grape:#9a7bff;--pink:#ff8fc1;--ok:light-dark(#109a5f,#4ee3a0)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg) radial-gradient(var(--dots) 2px,transparent 2.6px) 0 0/26px 26px;color:var(--ink);font:600 16px/1.55 Nunito,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,h4{font-family:"Baloo 2",Nunito,"PingFang SC",sans-serif;line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;font-weight:800;color:inherit;cursor:pointer;border:3px solid var(--line);border-radius:16px;min-height:44px;padding:8px 14px;background:var(--card);box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
input{font:inherit;font-size:16px;min-height:50px;border:3px solid var(--line);border-radius:16px;padding:8px 14px;background:var(--card);color:var(--ink);width:100%}
.hero{background:var(--bus);color:#1b2440;padding:14px max(4vw,16px) 18px;border-bottom:3px solid #1b2440;border-radius:0 0 30px 30px}
.brand{display:flex;gap:10px;align-items:center;max-width:760px;margin:auto}
.mascot{flex:none;width:clamp(78px,20vw,104px);height:auto}
.mascot.hop{animation:hop .6s}
@keyframes hop{30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.brand h1{font-size:clamp(30px,7vw,42px);font-weight:800}
.bubble{position:relative;background:#fff;color:#1b2440;border:3px solid #1b2440;border-radius:18px;padding:6px 12px;font-weight:800;font-size:15px;margin-top:4px;display:inline-block}
.bubble::before{content:"";position:absolute;left:-11px;top:12px;border:8px solid transparent;border-right-color:#1b2440}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kids,.stats{max-width:760px;margin:12px auto 0}
.kids button{background:#fff;color:#1b2440;border-color:#1b2440;box-shadow:0 4px 0 #1b2440}.kids button.on{background:var(--sky);color:#fff}
.pill{background:#fff;color:#1b2440;border:2.5px solid #1b2440;border-radius:99px;padding:3px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:10px max(4vw,12px) 12px;background:var(--bg);overflow-x:auto}
.tabs button{flex:none;border-radius:99px;font-size:15px}.tabs button.on{background:var(--coral);color:#fff}
main{max-width:760px;margin:auto;padding:14px max(4vw,16px) 90px}
section+section{margin-top:26px}
h2{font-size:clamp(28px,6vw,38px)}h3{font-size:23px;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
h3::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--coral);border:2.5px solid var(--line);flex:none}
.tag{display:inline-block;background:var(--grape);color:#fff;border:2.5px solid var(--line);border-radius:99px;padding:1px 12px;font-weight:800;font-size:14px;margin-bottom:6px}
.sub{color:var(--muted);margin:6px 0 0}
.sheet{background:var(--card);border:3px solid var(--line);border-radius:24px;box-shadow:5px 6px 0 var(--line);padding:16px}
.tophead{display:flex;gap:14px;align-items:center}.ticon{flex:none;width:clamp(72px,18vw,96px);height:auto}
.plan{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.plan button{width:100%;text-align:left;display:flex;gap:8px;align-items:center;font-size:15px}
.plan .dot{flex:none;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;font-size:14px;background:var(--bg)}
.plan .done button{background:color-mix(in srgb,var(--mint) 25%,var(--card))}.plan .done .dot{background:var(--mint);color:#fff}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px}
.wc{background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:4px 5px 0 var(--line);overflow:hidden}
.wc .top{padding:10px 12px;border-bottom:3px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px;color:#1b2440}
.wc:nth-child(5n+1) .top{background:var(--bus)}.wc:nth-child(5n+2) .top{background:var(--sky)}.wc:nth-child(5n+3) .top{background:var(--mint)}.wc:nth-child(5n+4) .top{background:var(--pink)}.wc:nth-child(5n) .top{background:#c7b6ff}
.wc b{font-family:"Baloo 2";font-size:28px;line-height:1}.wc .zh{color:var(--muted);font-weight:800;padding:8px 12px 0}
.wc .ex{padding:4px 12px 12px;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.say{min-height:38px;min-width:44px;padding:3px 10px;background:var(--bus);color:#1b2440;border-radius:99px;font-size:14px;border-width:2.5px;box-shadow:0 3px 0 var(--line)}
.say.slow{background:var(--card);color:var(--ink)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list li{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.list li span small{display:block;color:var(--muted)}
.dlg li.y{background:var(--soft)}.who{font-weight:800;font-size:13px;color:var(--muted);display:block}
.tone{color:var(--coral);font-weight:800}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px;margin-top:20px}
.note{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px;box-shadow:4px 5px 0 var(--line)}.note h4{margin:0 0 6px;font-size:19px}
.note.c1{background:color-mix(in srgb,var(--sky) 18%,var(--card))}.note.c2{background:color-mix(in srgb,var(--pink) 18%,var(--card))}.note.c3{background:color-mix(in srgb,var(--mint) 18%,var(--card))}
.note p{margin:4px 0}.bad{text-decoration:line-through;color:var(--coral)}.good{color:var(--ok);font-weight:800}
.pat{font-family:"Baloo 2";font-size:24px;line-height:1.2;margin:4px 0 10px}.pat u{text-decoration-color:var(--coral);text-decoration-thickness:3px}
.big{background:var(--coral);color:#fff;padding:12px 20px}
.ghost{background:var(--card)}
.practice{background:var(--card);border:3px solid var(--line);border-radius:28px;box-shadow:5px 6px 0 var(--line);padding:clamp(16px,4vw,26px);text-align:center}
.practice .target{font-family:"Baloo 2";font-size:clamp(28px,7vw,42px);line-height:1.15;margin:8px 0}
.practice .zh{color:var(--muted);font-weight:800}
.mic{width:96px;height:96px;border-radius:50%;background:var(--coral);color:#fff;font-size:15px;margin:16px auto 10px;display:grid;place-items:center;line-height:1.2;box-shadow:0 6px 0 var(--line)}
.mic.on{background:var(--mint);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 var(--line),0 0 0 16px #3ccf9140}}
.typebox{display:flex;gap:8px;margin-top:10px}.typebox button{flex:none}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0}
.result{margin-top:14px;font-size:21px;line-height:1.7}.result .w{padding:0 3px;border-radius:8px}
.result .y{color:var(--ok);font-weight:800}.result .n{color:var(--coral);text-decoration:underline wavy}
.score{font-family:"Baloo 2";font-size:52px;line-height:1;color:var(--coral)}
.prog{height:16px;background:var(--bg);border:2.5px solid var(--line);border-radius:99px;overflow:hidden;margin:8px 0 14px}.prog i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--mint) 0 10px,#5be3a8 10px 20px)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin-top:14px}
.opts button{text-align:left}
.opts .right{background:color-mix(in srgb,var(--mint) 35%,var(--card))}.opts .wrong{background:color-mix(in srgb,var(--coral) 30%,var(--card))}
.chat{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.b{max-width:85%;padding:10px 14px;border-radius:20px 20px 20px 6px;background:var(--card);border:3px solid var(--line)}
.b.me{align-self:flex-end;background:var(--bus);color:#1b2440;border-radius:20px 20px 6px 20px}
.fix{align-self:flex-end;max-width:85%;border:3px dashed var(--coral);background:var(--card);border-radius:16px;padding:8px 12px;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px}.chips button{flex:none;font-size:14px;min-height:40px;border-radius:99px}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.stat div{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px}.stat b{font-family:"Baloo 2";font-size:32px;display:block;line-height:1;color:var(--coral)}
.tips li{margin:6px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) scale(.8);background:var(--mint);color:#fff;border:3px solid #1b2440;padding:10px 20px;border-radius:99px;font-weight:800;opacity:0;transition:.2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.cf{position:fixed;width:12px;height:12px;border-radius:3px;z-index:8;pointer-events:none;animation:cf 1s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.mic.on,.mascot.hop,.cf{animation:none}.cf{display:none}}
textarea{width:100%;min-height:160px;font:14px/1.5 inherit;border-radius:14px;padding:10px;background:var(--card);color:var(--ink);border:3px solid var(--line)}
.hide{display:none!important}
</style>
</head>
<body>
<header class="hero">
  <div class="brand">
    <svg class="mascot" id="pip" viewBox="0 0 120 120" aria-label="Pip 小鸡老师"><ellipse cx="60" cy="112" rx="30" ry="5" fill="#1b2440" opacity=".18"/><path d="M48 104l-6 8M72 104l6 8" stroke="#ff8a1f" stroke-width="5" stroke-linecap="round"/><path d="M56 22c-2-10 8-14 10-6 4-8 14-2 8 6" fill="#ffcf33" stroke="#1b2440" stroke-width="4" stroke-linejoin="round"/><circle cx="60" cy="64" r="42" fill="#ffe066" stroke="#1b2440" stroke-width="4"/><ellipse cx="60" cy="80" rx="24" ry="18" fill="#fff4b8"/><path d="M18 60a42 42 0 0 1 84 0" fill="none" stroke="#1b2440" stroke-width="7"/><rect x="10" y="54" width="16" height="24" rx="7" fill="#4cb8ff" stroke="#1b2440" stroke-width="4"/><rect x="94" y="54" width="16" height="24" rx="7" fill="#4cb8ff" stroke="#1b2440" stroke-width="4"/><circle cx="46" cy="58" r="7" fill="#1b2440"/><circle cx="74" cy="58" r="7" fill="#1b2440"/><circle cx="48.5" cy="55.5" r="2.4" fill="#fff"/><circle cx="76.5" cy="55.5" r="2.4" fill="#fff"/><ellipse cx="37" cy="72" rx="6" ry="4" fill="#ff8fc1"/><ellipse cx="83" cy="72" rx="6" ry="4" fill="#ff8fc1"/><path d="M52 68q8 10 16 0z" fill="#ff8a1f" stroke="#1b2440" stroke-width="3" stroke-linejoin="round"/></svg>
    <div><h1>Speak Up!</h1><div class="bubble" id="pipSay">Hi! Let's talk!</div></div>
  </div>
  <div class="kids row" id="kids"></div>
  <div class="stats row" id="stats"></div>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="today">今日学习单</button><button data-tab="listen">听力</button><button data-tab="speak">跟读+勇敢说</button><button data-tab="chat">情景对话</button><button data-tab="parent">家长</button>
</nav>
<main id="view"></main>
<div id="toast"></div>
<script>
{
/* ---------- 课程内容：8个生活场景 × 两个级别（Level 1 = 四年级，Level 2 = 六年级） ---------- */
const T=[
{id:'school',zh:'在学校',en:'At School',role:['Ms. Lee, the child\'s friendly classroom teacher','Mr. Brown, the child\'s 6th grade teacher'],scene:'an elementary school classroom',
 tip:['th 音','"thank you""three" 舌尖轻放上下牙之间吹气，不要说成 "sank you"。'],
 gram:['He is my teacher. She is very nice. (指同一位女老师)','She is my teacher. She is very nice.','he / she 要分清：女老师用 she，男老师用 he。'],
 talk:['Tell me about your teacher.','What is your favorite class, and why?'],
 L1:{w:[['pencil','铅笔','Can I borrow a pencil?'],['bathroom','洗手间','May I go to the bathroom?'],['lunch','午饭','What\'s for lunch today?'],['teacher','老师','My teacher is nice.'],['help','帮助','Can you help me, please?']],
  p:[['Excuse me.','打扰一下'],['I don\'t understand.','我不明白'],['Can you say that again?','能再说一遍吗？'],['I\'m done!','我做完了！']],
  d:[['A','Good morning! How are you today?'],['Y','I\'m good, thank you.'],['A','Do you have your homework?'],['Y','Yes, here it is.'],['A','Great job! Please sit down.'],['Y','Excuse me, may I go to the bathroom?']],other:'Teacher'},
 L2:{w:[['assignment','作业，任务','When is the assignment due?'],['recess','课间休息','We play soccer at recess.'],['explain','解释','Could you explain that again?'],['partner','搭档','Can I work with a partner?'],['due','到期，截止','The project is due on Friday.']],
  p:[['Could you explain it in a different way?','能换个方式解释吗？'],['I\'m not sure, but I think...','我不确定，但我觉得…'],['What page are we on?','我们在第几页？'],['Can I work with a partner?','我可以和同伴一起做吗？']],
  d:[['A','Okay class, open your books. Any questions?'],['Y','Excuse me, what page are we on?'],['A','Page forty-two. Do you understand the assignment?'],['Y','Not really. Could you explain it in a different way?'],['A','Sure. Write five sentences about your weekend.'],['Y','Got it. When is it due?'],['A','It\'s due on Friday.']],other:'Teacher'}},
{id:'market',zh:'在超市',en:'At the Supermarket',role:['a friendly store worker','a friendly cashier'],scene:'a U.S. supermarket',
 tip:['不发音的字母','aisle 读 /aɪl/（像 "I\'ll"），receipt 里的 p 不发音。'],
 gram:['I want two apple.','I want two apples.','两个以上要加 -s，结尾 s 要读出来。'],
 talk:['What do you like to buy at the store?','Tell me how you help your family when you go shopping.'],
 L1:{w:[['cart','购物车','Let\'s get a cart.'],['milk','牛奶','We need some milk.'],['aisle','货架通道','The bread is in aisle five.'],['cheap','便宜','This one is cheap.'],['bag','袋子','Do you need a bag?']],
  p:[['Where is the milk?','牛奶在哪里？'],['How much is this?','这个多少钱？'],['Yes, please.','好的，谢谢'],['No, thank you.','不用了，谢谢']],
  d:[['A','Hi! Can I help you find something?'],['Y','Yes, please. Where is the milk?'],['A','It\'s in aisle seven, at the back.'],['Y','Thank you!'],['A','You\'re welcome. Have a nice day!'],['Y','You too!']],other:'Worker'},
 L2:{w:[['coupon','优惠券','Mom has a coupon for cereal.'],['checkout','收银台','Let\'s go to the checkout.'],['receipt','收据','Can I have the receipt?'],['on sale','促销','Strawberries are on sale.'],['compare','比较','Let\'s compare the prices.']],
  p:[['Is this on sale?','这个在打折吗？'],['Can I use this coupon?','可以用这张优惠券吗？'],['Can I pay with a card?','可以刷卡吗？'],['Did you find everything okay?','都找到了吗？（收银员常问）']],
  d:[['A','Hi there! Did you find everything okay?'],['Y','Yes, thanks. Are these strawberries on sale?'],['A','They are. Two boxes for five dollars.'],['Y','Great, I\'ll take two. Can I use this coupon too?'],['A','Sure! Would you like your receipt?'],['Y','Yes, please. Thank you!']],other:'Cashier'}},
{id:'food',zh:'在餐厅',en:'At a Restaurant',role:['a friendly waiter','a friendly waiter'],scene:'a family restaurant',
 tip:['词尾辅音','check、burger、fries 的结尾音要轻轻读出来，不要吞掉，也不要加"呃"。'],
 gram:['I want a burger.','I would like a burger, please.','点餐用 I would like / Can I have... 更礼貌。'],
 talk:['What is your favorite food?','Tell me about the best meal you ever had.'],
 L1:{w:[['menu','菜单','Can I see the menu?'],['water','水','Can I have some water, please?'],['hungry','饿','I\'m so hungry!'],['spicy','辣','Is it spicy?'],['check','账单','Can we have the check, please?']],
  p:[['I would like a cheeseburger.','我想要一个芝士汉堡'],['Can I have some water, please?','可以给我一些水吗？'],['It\'s yummy!','真好吃！'],['No ice, please.','请不要加冰']],
  d:[['A','Hi! Are you ready to order?'],['Y','Yes. I would like a cheeseburger, please.'],['A','Fries or salad on the side?'],['Y','Fries, please.'],['A','Anything to drink?'],['Y','Can I have some water, please?']],other:'Waiter'},
 L2:{w:[['order','点餐','I\'m ready to order.'],['recommend','推荐','What do you recommend?'],['allergic','过敏的','I\'m allergic to peanuts.'],['refill','续杯','Can I get a refill?'],['to-go box','打包盒','Can I get a to-go box?']],
  p:[['What do you recommend?','你推荐什么？'],['Does this have nuts in it?','这个有坚果吗？'],['Can I get a refill, please?','可以续杯吗？'],['Can I get a to-go box?','能给我个打包盒吗？']],
  d:[['A','Welcome! Have you decided yet?'],['Y','Almost. What do you recommend?'],['A','The chicken pasta is really popular.'],['Y','Does it have nuts in it? I\'m allergic to peanuts.'],['A','No nuts at all. It\'s safe.'],['Y','Perfect, I\'ll have that. Could I also get a lemonade?']],other:'Waiter'}},
{id:'mall',zh:'在商场',en:'At the Mall',role:['a friendly salesperson in a shoe store','a friendly salesperson in a clothing store'],scene:'a shopping mall',
 tip:['v 和 w','very、over：上牙咬下唇；wear、want：嘴唇圆起来。不要把 very 说成 "wery"。'],
 gram:['It is very big for me.','It is too big for me.','"太大不合适"用 too，不用 very。'],
 talk:['What do you like to wear?','Tell me about something you really want to buy.'],
 L1:{w:[['shoes','鞋子','I need new shoes.'],['size','尺码','What size are you?'],['try on','试穿','Can I try it on?'],['color','颜色','I like this color.'],['price','价格','What is the price?']],
  p:[['Can I try this on?','我能试穿吗？'],['It\'s too small.','太小了'],['Just looking, thanks.','我只是看看，谢谢'],['Where is the fitting room?','试衣间在哪？']],
  d:[['A','Hi! Can I help you?'],['Y','Just looking, thanks.'],['A','Okay! Let me know if you need anything.'],['Y','Excuse me, can I try these shoes on?'],['A','Sure! What size?'],['Y','Size four, please.']],other:'Salesperson'},
 L2:{w:[['fitting room','试衣间','The fitting room is over there.'],['exchange','换货','Can I exchange this shirt?'],['discount','折扣','Is there a student discount?'],['brand','品牌','What brand is this?'],['afford','买得起','I can\'t afford it right now.']],
  p:[['Do you have this in a different color?','这个有别的颜色吗？'],['Could I exchange this for a smaller size?','能换小一号吗？'],['Is there a discount on this?','这个有折扣吗？'],['I\'ll think about it.','我再想想']],
  d:[['A','Hi, welcome! Looking for anything special?'],['Y','Yes. Do you have this hoodie in a different color?'],['A','We have it in blue and gray.'],['Y','Could I try the gray one in a medium?'],['A','Of course. The fitting room is over there.'],['Y','Thanks! Is there a discount on hoodies today?'],['A','Yes, everything on this wall is twenty percent off.']],other:'Salesperson'}},
{id:'friends',zh:'交朋友',en:'Making Friends',role:['Maya, a friendly kid at recess','Maya, a friendly classmate'],scene:'the school playground at recess',
 tip:['r 和 l','ready：舌头卷起不碰上颚；play、lunch：舌尖顶住上牙后面。'],

let TTS=null,DIC=null,AI=null,listening=false,micCb=null,acc='';
function enVoices(){try{return speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang))}catch(e){return[]}}
function stopAll(){try{TTS&&TTS.stop()}catch(e){}try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}
function sayLines(lines,slow){
  stopAll();
  if(TTS){TTS.speak(lines.map(([sp,t])=>({text:fill(t),voice:sp==='Y'?'rounded':'airy',rate:slow?0.75:(S.speed||1),language:'en'}))).catch(e=>{if(e&&e.code==='not_granted'){TTS=null;sayLines(lines,slow)}});return}
  if(!window.speechSynthesis){toast('这个设备不能播放语音');return}
  const vs=enVoices();
  lines.forEach(([sp,t])=>{const u=new SpeechSynthesisUtterance(fill(t));u.lang='en-US';u.rate=slow?0.7:0.95*(S.speed||1);if(vs.length)u.voice=vs[sp==='Y'?Math.min(1,vs.length-1):0];speechSynthesis.speak(u)});
}
const say=(t,slow)=>sayLines([['A',t]],slow);
function micBtn(){return DIC?'<button class="mic" data-mic>点我<br>开始说</button>':''}
function startMic(onText,onDone){
  if(!DIC)return;
  if(listening){DIC.stop().catch(()=>{});return}
  stopAll();acc='';micCb={onText,onDone};
  DIC.start().catch(e=>{micCb=null;if(e&&e.code==='not_granted'){DIC=null;render()}toast('麦克风没打开，可以用键盘上的麦克风听写或打字')});
}
function setupDic(d){
  DIC=d;
  d.onPartial(({text})=>{micCb&&micCb.onText((acc+' '+text).trim())});
  d.onFinal(({text})=>{acc=(acc+' '+text).trim();micCb&&micCb.onText(acc)});
  d.onState(({state})=>{listening=state==='listening';document.querySelectorAll('[data-mic]').forEach(b=>{b.classList.toggle('on',listening);b.innerHTML=listening?'说完了<br>点我停':'点我<br>开始说'});if(state==='idle'&&micCb){const c=micCb;micCb=null;c.onDone(acc)}});
  render();
}
function nativeDic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  let r=null;const h={p:()=>{},f:()=>{},s:()=>{}};
  return{start(){return new Promise((res,rej)=>{try{r=new SR();r.lang='en-US';r.interimResults=true;r.continuous=false;
    r.onstart=()=>{h.s({state:'listening'});res()};
    r.onresult=e=>{let fin='',part='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else part+=t}if(fin)h.f({text:fin});else h.p({text:part})};
    r.onerror=e=>{if(/not-allowed|service-not-allowed|audio-capture/.test(e.error))rej({code:'not_granted'})};
    r.onend=()=>{r=null;h.s({state:'idle'})};r.start()}catch(e){rej({code:'not_granted'})}})},
   stop(){try{r&&r.stop()}catch(e){}return Promise.resolve()},onPartial(f){h.p=f},onFinal(f){h.f=f},onState(f){h.s=f}};
}
setTimeout(()=>{
  if(window.claude&&claude.use){
    claude.use('tts').then(t=>{TTS=t}).catch(()=>{});
    claude.use('dictation').then(d=>{const x=d||nativeDic();if(x)setupDic(x)}).catch(()=>{});
    claude.use('sample').then(s=>{AI=s;render()}).catch(()=>{});
  }else{const x=nativeDic();if(x)setupDic(x)}
},0);

const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);
function grade(target,said){
  const a=norm(target),b=norm(said),n=a.length,m=b.length,dp=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return{words:a,ok,pct:n?Math.round(ok.filter(Boolean).length/n*100):0};
}
const tone=s=>/\?$/.test(s)?(/^(what|where|when|who|why|how|which)\b/i.test(s.replace(/^(sorry|excuse me|okay|so|yes|no|sure)[,.!]?\s*/i,''))?' <span class="tone" title="句尾下降">↘</span>':' <span class="tone" title="句尾上扬">↗</span>'):'';

let Q=null;
function buildQuiz(){
  const k=kid(),L=lesson(),pool=T.flatMap(t=>t['L'+k.lvl].w).filter(x=>!L.w.some(y=>y[0]===x[0]));
  const qs=shuffle(L.w).slice(0,3).map(w=>({audio:w[0],ans:w[1],opts:shuffle([w[1],...shuffle(pool).slice(0,3).map(x=>x[1])]),kind:'听单词，选意思'}));
  const sents=[...L.w.map(x=>x[2]),...L.p.map(x=>x[0]),...L.d.map(x=>fill(x[1]))];
  shuffle(sents).slice(0,3).forEach(s=>qs.push({audio:s,ans:s,opts:shuffle([s,...shuffle(sents.filter(x=>x!==s)).slice(0,3)]),kind:'听句子，选你听到的'}));
  shuffle(L.p).slice(0,2).forEach(p=>qs.push({audio:p[0],ans:p[0],dict:true,kind:'听写：听到什么就写什么'}));
  {const s=ex().sl[Math.floor(Math.random()*2)],pz=Object.values(E).flatMap(x=>x.sl.map(y=>y[1])).filter(z=>z!==s[1]);qs.push({audio:s[0],ans:s[1],opts:shuffle([s[1],...shuffle(pz).slice(0,3)]),kind:'地道口语：听一听，选意思'})}
  prevWords(2).forEach(w=>qs.push({audio:w[0],ans:w[1],opts:shuffle([w[1],...shuffle(pool.filter(x=>x[1]!==w[1])).slice(0,3).map(x=>x[1])]),kind:'复习旧词：听单词，选意思'}));
  Q={qs,i:0,right:0,picked:null,res:null};
}

  ${nextY?(C.hide?`<p class="hint">轮到你说了！不看提示，凭记忆说。</p>`:`<p class="hint">轮到你说：<b>${esc(fill(nextY[1]))}</b> ${sayBtns(fill(nextY[1]))}</p>`):''}

function chatPrompt(){
  const k=kid(),t=topic(),L=lesson();
  return `You are role-playing as ${t.role[k.lvl-1]} in ${t.scene} in the United States, talking with a Chinese-speaking child who lives in the U.S. (grade ${k.grade}, English learner level ${k.lvl} of 6). The child's name is ${k.en}.
${k.lvl===1?'Use very simple words and short sentences (max 10 words each).':'Use simple, natural everyday English (sentences up to 15 words).'}
Today's words: ${L.w.map(w=>w[0]).join(', ')}. Use them naturally and give the child chances to use them.
Be warm, patient and encouraging. End every turn with exactly one easy question so the child keeps talking. Stay in character. Keep everything kid-safe.
Look at the child's LAST message (it came from speech-to-text, so ignore spelling, capitals and punctuation). If it has a real grammar or word-choice mistake, or sounds unnatural, give a fix; otherwise fix is null.
Conversation so far:
${C.log.map(m=>(m.r==='me'?'Child: ':'You: ')+m.t).join('\n')||'(none yet — open the conversation in character)'}
Respond with JSON only: {"reply":"your next line, 1-2 short sentences","fix":null or {"better":"natural corrected version of the child's last message","zh":"一句简短的中文解释"},"praise":"2-5 word English praise for the child's last message, or empty string if there is none yet"}`;
}
async function aiTurn(){
  C.busy=true;render();const j=await askAI(chatPrompt());C.busy=false;
  if(j){const me=[...C.log].reverse().find(m=>m.r==='me');if(me){me.fix=j.fix&&j.fix.better?j.fix:null;me.praise=j.praise||''}C.log.push({r:'ai',t:j.reply||'Okay!'});say(j.reply||'')}
  render();scrollChat();
}
function scriptAdvance(){
  const L=lesson();
  const mine=C.swap?'A':'Y';while(C.step<L.d.length&&L.d[C.step][0]!==mine){const t=fill(L.d[C.step][1]);C.log.push({r:'ai',t});say(t);C.step++}
  render();scrollChat();
}
function chatSend(){
  const inp=document.getElementById('chatIn'),txt=inp.value.trim();if(!txt){toast('先说一句吧');return}
  if(C.mode==='script'){const L=lesson(),tg=fill(L.d[C.step][1]),g=grade(tg,txt);C.log.push({r:'me',t:txt,praise:g.pct>=80?'Nice! '+g.pct+' 分':'',fix:g.pct<80?{better:tg,zh:'对照一下，再说一遍试试（'+g.pct+' 分）'}:null});C.step++;addPts(g.pct>=80?2:1)}
  else{C.log.push({r:'me',t:txt});addPts(1)}
  if(C.log.filter(m=>m.r==='me').length>=4)markDone('chat');
  C.mode==='ai'?aiTurn():scriptAdvance();
}

  if(id==='copySheet'){const txt=sheetText();navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>toast('学习单已复制，可粘贴到备忘录或发给孩子')).catch(()=>{const box=document.getElementById('sheetBox');box.value=txt;box.classList.remove('hide');box.select()});if(!navigator.clipboard){const box=document.getElementById('sheetBox');box.value=txt;box.classList.remove('hide')}return}

  if(id==='startChat'){C.log=[];C.step=0;C.started=true;return C.mode==='ai'?aiTurn():scriptAdvance()}
  if(id==='restartChat'){const m=C.mode,sw=C.swap,hd=C.hide;chatReset();C.mode=m;C.swap=sw;C.hide=hd;return render()}
  if(id==='swapRole'){const sw=!C.swap,hd=C.hide;chatReset();C.mode='script';C.swap=sw;C.hide=hd;return render()}
  if(id==='hideHint'){C.hide=!C.hide;return render()}
  if(id==='modeAI'||id==='modeScript'){chatReset();C.mode=id==='modeAI'?'ai':'script';return render()}
  if(id==='send')return chatSend();
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;if(id==='dictIn')document.getElementById('dictGo').click();if(id==='said')checkSay();if(id==='chatIn')chatSend();if(id==='brave')braveSubmit()});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.name!=null){S.kids[+d.name].name=e.target.value.trim()||'孩子';save();renderTop()}if(d.en!=null){S.kids[+d.en].en=e.target.value.trim()||'Alex';save()}});
try{speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
render();
}
</script>
